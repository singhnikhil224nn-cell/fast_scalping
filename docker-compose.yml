version: '3.8'

services:
  engine:
    build: .
    container_name: eth_signal_engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
    env_file:
      - .env
    volumes:
      - .:/app
    command: python main.py

  api:
    build: .
    container_name: eth_signal_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  dashboard:
    build: .
    container_name: eth_signal_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    command: streamlit run dashboard/app.py

  postgres:
    image: postgres:15-alpine
    container_name: eth_signal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-quant}
      POSTGRES_PASSWORD: ${DB_PASS:-securepassword}
      POSTGRES_DB: ${DB_NAME:-signals}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-quant}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
